name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0). Leave empty to just build.'
        required: false
        default: ''
      mc_version:
        description: 'Minecraft version to build'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - '1.21.1'
      loader:
        description: 'Mod loader to build'
        required: false
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'fabric'
          - 'forge'
          - 'neoforge'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and loader lists
        run: |
          MC_IN="${{ inputs.mc_version }}"
          LOADER_IN="$(echo "${{ inputs.loader }}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [ -n "$MC_IN" ] && [ "$MC_IN" != "all" ]; then
            VERSIONS="$MC_IN"
          else
            VERSIONS=$(grep -E '^supported_versions' gradle.properties | cut -d'=' -f2 | tr -d ' ')
            VERSIONS=$(echo "$VERSIONS" | tr ',' ' ')
          fi
          if [ -n "$LOADER_IN" ] && [ "$LOADER_IN" != "all" ]; then
            LOADERS="$LOADER_IN"
          else
            LOADERS=$(grep -E '^enabled_platforms' gradle.properties | cut -d'=' -f2 | tr -d ' ')
            LOADERS=$(echo "$LOADERS" | tr ',' ' ')
          fi
          if [ -z "$VERSIONS" ] || [ -z "$LOADERS" ]; then
            echo "ERROR: failed to resolve versions or loaders"
            exit 1
          fi
          echo "Versions: $VERSIONS"
          echo "Loaders:  $LOADERS"
          echo "VERSIONS=$VERSIONS" >> "$GITHUB_ENV"
          echo "LOADERS=$LOADERS" >> "$GITHUB_ENV"

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          FIGURA_VERSION=$(grep -E '^figura_version' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          mkdir -p .libs dist

          for mc in $VERSIONS; do
            jar="figura-${FIGURA_VERSION}+${mc}-fabric-mc.jar"
            url="https://github.com/FiguraMC/Figura/releases/download/${FIGURA_VERSION}/${jar}"
            echo "== MC ${mc}: fetching ${jar}"
            curl -fL "$url" -o ".libs/${jar}" || { echo "ERROR: no Figura release for MC ${mc}"; exit 1; }
          done

          VERSION_COUNT=$(echo $VERSIONS | wc -w)
          LOADER_COUNT=$(echo $LOADERS | wc -w)
          if [ "$VERSION_COUNT" -eq 1 ] && [ "$LOADER_COUNT" -eq 1 ]; then
            # one version, one loader
            TASK=":${LOADERS}:${VERSIONS}:buildAndCollect"
          elif [ "$VERSION_COUNT" -eq 1 ]; then
            # one version, all loaders
            TASK="chiseledBuild$(echo "${VERSIONS}" | tr '.' '_')"
          elif [ "$LOADER_COUNT" -eq 1 ]; then
            # one loader, all versions
            LOADER_UPPER="$(echo ${LOADERS} | sed 's/./\U&/')"
            TASK="chiseledBuild${LOADER_UPPER}"
          else
            # all versions, all loaders
            TASK="chiseledBuild"
          fi
          echo "== running ${TASK}"
          ./gradlew "${TASK}" --no-daemon

          set -e
          shopt -s nullglob
          for mc in $VERSIONS; do
            for loader in $LOADERS; do
              found=()
              for src in build/libs/*/*/figura-relay-*+${mc}-${loader}.jar; do
                if [[ "$src" != *"sources.jar" ]]; then found+=("$src"); fi
              done
              if [ ${#found[@]} -eq 0 ]; then
                echo "ERROR: no jar for MC ${mc} / ${loader} in build/libs"; exit 1
              fi
              cp "${found[0]}" "dist/"
              if [ -n "$TAG" ]; then
                mkdir -p release
                cp "${found[0]}" "release/figura-relay-${TAG}-mc${mc}-${loader}.jar"
              fi
            done
          done
          shopt -u nullglob
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figura-relay-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Create release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release/*.jar

      - name: Cleanup
        run: rm -rf .libs/ dist/ release/
