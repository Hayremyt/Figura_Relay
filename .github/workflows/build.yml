name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0). Leave empty to just build.'
        required: false
        default: ''

env:
  # Compile-time dependency (official Figura release), not stored in the repository.
  FIGURA_URL: https://github.com/FiguraMC/Figura/releases/download/0.1.6/figura-0.1.6+1.21.1-fabric-mc.jar

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download dependencies
        run: |
          mkdir .libs
          curl -L "$FIGURA_URL" -o .libs/figura-0.1.6+1.21.1-fabric-mc.jar
          ls -la .libs/

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: figura-relay-${{ github.sha }}
          path: |
            fabric/build/libs/figura-relay-*-fabric.jar
            forge/build/libs/figura-relay-*-forge.jar
            neoforge/build/libs/figura-relay-*-neoforge.jar
          if-no-files-found: error

      - name: Collect release jars
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release
          for plat in fabric forge neoforge; do
            src=$(ls */build/libs/figura-relay-*-$plat.jar | head -n 1)
            cp "$src" "release/figura-relay-${TAG}-${plat}.jar"
          done
          ls -la release/

      - name: Create release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release/*.jar

      - name: Cleanup
        run: rm -rf .libs/ release/
