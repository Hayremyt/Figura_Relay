architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/figura-relay.accesswidener")
}

dependencies {
    mappings loom.layered {
        mappings("org.quiltmc:quilt-mappings:$minecraft_version+build.$mappings:intermediary-v2")
        officialMojangMappings()
    }

    // Clean Figura 0.1.6 for mixin targets (see gradle.properties for how to install it)
    // Official Figura release jar, placed into .libs/ locally and downloaded
    // in CI (see .github/workflows/build.yml); not stored in the repository.
    // modCompileOnly makes Loom remap it to the project's mappings.
    modCompileOnly files("$rootDir/.libs/figura-0.1.6+1.21.1-fabric-mc.jar")

    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}
