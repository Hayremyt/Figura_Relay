plugins {
	id "architectury-plugin" version "3.4-SNAPSHOT"
	id "dev.architectury.loom" version "1.7-SNAPSHOT" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	repositories {
		// Official CDN mirror of the NeoForged maven — maven.neoforged.net itself
		// is unreachable from this machine (connection timed out).
		maven { url 'https://neoforged.forgecdn.net/releases/' }
		mavenLocal()
		maven { url 'https://maven.terraformersmc.com/releases/' }
		maven { url 'https://api.modrinth.com/maven' }
		maven { url 'https://maven.quiltmc.org/repository/release/' }
		maven { url 'https://maven.neoforged.net/releases/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	java_version = rootProject.java_version
	archivesBaseName = rootProject.archives_base_name
	version = rootProject.mod_version + "+" + rootProject.minecraft_version
	group = rootProject.maven_group
	if (project.hasProperty("release")) {
		jarVersion = version
	} else {
		String gitHash = "local"
		try {
			String h = 'git rev-parse --short HEAD'.execute().getText().trim()
			if (h != null && !h.isEmpty()) gitHash = h
		} catch (Exception ignored) {}
		jarVersion = version + "-" + gitHash
	}

	repositories {
		mavenLocal()
		maven { url 'https://jitpack.io' }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = Integer.valueOf(java_version)
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
		withSourcesJar()
	}
}
