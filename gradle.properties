# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
# Chiseled (multi-version) builds must run sequentially; parallel loom
# runs are known to flake on shared mapping caches.
org.gradle.parallel=false
org.gradle.caching=true

# Mod properties
mod.id=figura_relay
mod.name=Figura Relay
mod.version=1.0
mod.group=org.figurarelay

# Figura (compileOnly, for mixins). The release jar is fetched per MC version:
# https://github.com/FiguraMC/Figura/releases/download/<figura_version>/figura-<figura_version>+<minecraft_version>-fabric-mc.jar
figura_version=0.1.6

# Non-versioned dependencies
deps.fabric_loader=0.15.11

# Versions the CI workflow builds when no specific version is selected.
# Extend when porting to another MC version (also add to versions(...) in
# settings.gradle.kts).
supported_versions=1.21.1
