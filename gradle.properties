# Gradle Configuration
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true

# Environment Properties
java_version = 21
minecraft_version = 1.21.1
mappings = 2
enabled_platforms = fabric,forge,neoforge

# Mod Properties
mod_version = 1.0
maven_group = org.figurarelay
archives_base_name = figura-relay

# Figura (compileOnly, for mixins) — clean 0.1.6 common jar, installed to mavenLocal as:
#   org.figuramc:figura-common:0.1.6
# Build it with:  cd ../Figura-0.1.6-dev-1.21-clean && ./gradlew :common:remapJar
# Then copy common/build/devlibs/figura-0.1.6+1.21.1-dev.jar to
#   ~/.m2/repository/org/figuramc/figura-common/0.1.6/figura-common-0.1.6.jar (+ minimal pom)
figura_common_version = 0.1.6

# Fabric Properties
fabric_loader_version = 0.15.11
fabric_api = 0.109.0+1.21.1

# Forge Properties
forge_version = 1.21.1-52.0.28

# NeoForge Properties
# NOTE: maven.neoforged.net is unreachable from this machine; build.gradle
# resolves NeoForged artifacts from the official CDN mirror neoforged.forgecdn.net.
neoforge_version = 21.1.225

# Extra (declares the jarVersion project property used by build.gradle)
jarVersion
